# 本地开发环境（默认激活）：连本机 MySQL / Redis
# 密码等敏感项放 application-local.yml（不入库），见仓库根 docs 规范"环境与版本矩阵"
spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/scenic_tour?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

app:
  upload:
    # 文件落盘根目录：分片 tmp 子目录 + yyyyMM 最终目录
    dir: ./uploads

# 大文件分片上传需要放大请求体限制（默认 1MB 会拦掉分片）
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 12MB
