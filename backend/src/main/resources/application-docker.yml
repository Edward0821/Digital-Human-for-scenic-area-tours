# Docker 部署环境：主机名对齐 docker-compose 服务名（见 deploy/ 目录，后续提供）
# 启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=docker
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://scenic-mysql:3306/scenic_tour?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 业务账号（最小权限，非 root），由 MySQL 容器按 MYSQL_USER/MYSQL_PASSWORD 自动创建并授权
    username: scenic_app
    password: ${MYSQL_APP_PASSWORD}
  data:
    redis:
      host: scenic-redis
      port: 6379
      database: 0
