server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 第十二周任务③ 安全基线（ZAP baseline 修复：防点击劫持/MIME 嗅探/referrer 泄露/权限声明/CSP）
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:" always;

    # 第十一周提速·① gzip 压缩（与 nginx-dev.conf 同步；gzip 指令在 server 上下文同样生效）
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1k;
    gzip_comp_level 5;

    # ---------- 静：静态资源直接由 Nginx 返回，带 7 天长缓存 ----------
    # 注意：本 location 自带 add_header（Cache-Control），会终止从 server 继承安全响应头——必须重复声明
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:" always;
        try_files $uri =404;
    }

    # ---------- 动：/api 反代后端 Spring Boot ----------
    location /api/ {
        proxy_pass http://scenic-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 预留：未来语音流式输出（TTS/数字人口型）需要禁用缓冲
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---------- Vue Router history 模式兜底：任意路径回 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
