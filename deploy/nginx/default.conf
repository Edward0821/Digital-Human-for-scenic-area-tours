server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 静：静态资源直接由 Nginx 返回，带 7 天长缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 动：/api 反代后端 Spring Boot ----------
    location /api/ {
        proxy_pass http://scenic-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 预留：未来语音流式输出（TTS/数字人口型）需要禁用缓冲
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---------- Vue Router history 模式兜底：任意路径回 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
