# 第十周作业题1：Nginx 网关限流（Windows 本机演示配置）
# 使用方法：把本文件复制到 Nginx 目录的 conf/nginx.conf（覆盖默认），
#          在 Nginx 目录执行：start nginx  /  nginx -s reload  /  nginx -s stop
# 压测：node deploy/nginx/stress-qa.mjs（100 并发 → 观察放行/拒绝数）
#
# 参数讲解（答辩口径）：
# - limit_req_zone：定义限流区域，$binary_remote_addr=按客户端 IP 维度，
#   rate=10r/s=每个 IP 每秒匀速放行 10 个请求（漏桶速率）
# - limit_req zone=qa_zone burst=20 nodelay：
#   burst=20 允许 20 个突发排队额度；nodelay 表示突发额度内的请求立即处理不延迟；
#   超过"速率+突发"的请求直接拒绝（默认 503）——在网关层把超额流量挡掉，
#   保护后面的应用服务器和大模型资源（有限资源不被争抢的第一道闸）
# - 动静分离：前端静态资源由 Nginx 直接返回（课堂口径：抢购页面大部分信息静态化，
#   不占应用服务器组装开销），只有 /api/ 请求反代到后端

worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 按 IP 限流区域：10m 共享内存约可存 16 万个 IP 状态
    limit_req_zone $binary_remote_addr zone=qa_zone:10m rate=10r/s;

    server {
        # 本机 80 被禅道 Apache 占用时改用 8090（按实际环境调整）
        listen 80;

        # 动静分离：前端构建产物直接由 Nginx 提供（路径按本机 Nginx 目录调整，
        # 相对于 Nginx 安装前缀）
        location / {
            root   ../../frontend/dist;   # 按实际路径修改，末尾不带 /
            try_files $uri $uri/ /index.html;
        }

        # API 反代 + 网关限流
        location /api/ {
            limit_req zone=qa_zone burst=20 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
